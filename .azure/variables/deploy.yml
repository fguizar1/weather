parameters:
  # example [servicios, ec]
  - name: area
    type: string

  # example [financieros, wallet, lealtad, yaya]
  - name: team
    type: string

  # example [develop, sandbox, production]
  - name: stage
    type: string

  # [A-Za-z0-9-]
  - name: serviceName
    type: string

  # Scope [tfStorage permissions, Deploy permissions]
  - name: serviceConnection
    type: string

variables:
  - name: nodeVersion
    value: "22.x"

  - name: functionAppType
    value: consumption

  - name: stage
    value: ${{ parameters.stage }}

  - name: serviceConnection
    value: ${{ parameters.serviceConnection }}

  - name: environment
    value: ${{ parameters.area }}-${{ parameters.team }}-${{ parameters.stage }}

  # Service variables scope [service]
  - group: vg-${{ parameters.area }}-${{ parameters.team }}-${{ parameters.serviceName }}-${{ parameters.stage }}

  # Shared variables scope [area-team]
  - group: vg-${{ parameters.area }}-${{ parameters.team }}-${{ parameters.stage }}
