openapi: 3.0.3


info:
  title: Weather Api with authorization JTW
  description: |
    API that allows you to register users, log in, and check the weather of a city using a JWT token.
    Every query and every error is recorded in a database, linked to the user who generated them.
  version: 1.0.0

servers:
  - url: http://localhost:7071
    description: Local Server

tags:
  - name: Auth
    description: User registration and authentication (login) endpoints
  - name: weather
    description: Weather queries portected by JWT token authentication


paths:

  /src/functions/recorded:

    post:
      tags:
        - Auth
      summary: Register a new user
      description: |
        Create a new users in the system. 

        The password is hashed usign bcryptjs and is never stored
        as plain text.

        Usernames are case-insensitive. For example, "Alvaro" and "alvaro" are considered the same username.

      operationId: registrarUsuario

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: Alvaro
                password:
                  type: string
                  example: '1234'
              
            
      responses:
        '201':
          description: User create Successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: User create

        '400':
          description: invalid data or user than exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: The user already exists.

  /src/functions/login:

    post:
      tags:
        - Auth
      summary: Login 
      description: Validate the user's credentials and return a JWT token to use on protected endpoints.
      operationId: loginUsuario

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: Alvaro
                password:
                  type: string
                  example: '1234'

      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type:
                properties:
                  token:
                    type : string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                $ref: ''
              


        '401':
          description: invalid credentials 
          content:
            application/json:
              schema:
                type:
                properties:
                  message:
                    type: string
                    example: username or password incorrect 
                $ref: ''


  /src/functions/weather:

    get:
      tags:
        - weather
      summary: Check the weather of a city
      description: Returns the current weather for the specified city.
       Requires a valid JWT token in the Authorization header. 
       Every successful request is saved in the weather_requests table; 
       every error (for example, city not found) is saved in the error_log table, 
       both linked to the user who made the request.
      operationId: consultarClima
      security:
        - bearerAuth: []

      parameters:
        - name: city
          in: text plane
          required: true
          description: Name of the city to look up
          schema:
            type: string
            example: Gudalajara

        - name: country
          in: query
          required: false
          description: |
            Optional ISO 3166-1 alpha-2 country code.
            Use two letters, for example 'MX', 'ES', 'US', or 'CA'.
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: MX

      responses:
        '200':
          description: Weather successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  latitude:
                    type: number
                    example: 20.6597
                  longitude:
                    type: number
                    example: -103.3496
                  temperature:
                    type: number
                    example: 25.5
        '400':
          description: Unable to retrieve the weather. (for example, city no found)
          content:
            application/json:
              schema:
                 type:
                 properties:
                  message:
                    type: string
                    example: city no found
                 $ref: ''

        '401':
          description: Unable to retrieve the weather. (for example, city no found)
          content:
            application/json:
              schema:
                 type:
                 properties:
                  message:
                    type: string
                    example: Invalid or missing JWT token
                 $ref: ''




